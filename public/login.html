<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login or register to the Student Assignment Management System.">
    <title>Login - Student Assignment Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- ========== AUTH HEADER ========== -->
            <div class="auth-header">
                <div class="logo">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 id="authTitle">Welcome Back</h1>
                <p id="authSubtitle">Login to your account to continue</p>
            </div>

            <!-- ========== ALERT CONTAINER ========== -->
            <div id="alertContainer"></div>

            <!-- ========== LOGIN FORM ========== -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" class="form-control" id="loginPassword"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>

                <div class="auth-footer">
                    Don't have an account?
                    <a href="#" onclick="toggleAuthForm('register')">Register here</a>
                </div>
            </form>

            <!-- ========== REGISTER FORM (hidden by default) ========== -->
            <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name *</label>
                    <input type="text" class="form-control" id="fullName"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" class="form-control" id="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Create a password (min 6 characters)" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password *</label>
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Role *</label>
                    <select class="form-control" id="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="STUDENT">Student</option>
                        <option value="FACULTY">Faculty / Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="department">Department</label>
                    <input type="text" class="form-control" id="department"
                           placeholder="e.g., Computer Science">
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>

                <div class="auth-footer">
                    Already have an account?
                    <a href="#" onclick="toggleAuthForm('login')">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/script.js"></script>
    <script>
        /**
         * Toggle between login and register forms.
         */
        function toggleAuthForm(form) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');

            if (form === 'register') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Register to start managing your assignments';
            } else {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Login to your account to continue';
            }
        }

        // Check if URL has #register hash to show register form
        if (window.location.hash === '#register') {
            toggleAuthForm('register');
        }

        // If already logged in, redirect to dashboard
        if (getToken()) {
            window.location.href = 'student-dashboard.html';
        }
    </script>

</body>
</html>
